services:
  postgres:
    image: postgres:16
    container_name: fastfood-pos-postgres
    environment:
      POSTGRES_DB: fastfood_pos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      TZ: America/La_Paz
      PGTZ: America/La_Paz
    ports:
      - "5432:5432"
    volumes:
      - fastfood_pos_data:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d

volumes:
  fastfood_pos_data:
