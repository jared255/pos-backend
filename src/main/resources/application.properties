spring.application.name=POS Backend API
# PostgreSQL local por defecto. Para Supabase sobreescribe estas
# propiedades con variables de entorno: DB_URL, DB_USER y DB_PASS.
db.url=jdbc:postgresql://localhost:5432/fastfoodbd
db.user=postgres
db.pass=postgres
db.pool.max=10
db.pool.auto-commit=false
db.pool.connection-timeout-ms=30000
